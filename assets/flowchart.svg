<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="900" height="540" fill="#f6f8fc"/>

  <!-- B1 -->
  <g id="B1">
    <rect x="280" y="24" width="240" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <rect x="280" y="24" width="4" height="44" rx="2" fill="#2563eb"/>
    <text x="402" y="51" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e40af" text-anchor="middle">B1 · 단계 1</text>
  </g>

  <!-- B2 -->
  <g id="B2">
    <rect x="280" y="102" width="240" height="44" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <rect x="280" y="102" width="4" height="44" rx="2" fill="#4f46e5"/>
    <text x="402" y="129" font-family="sans-serif" font-size="16" font-weight="600" fill="#3730a3" text-anchor="middle">B2 · 단계 2</text>
  </g>

  <!-- B3 -->
  <g id="B3">
    <rect x="280" y="180" width="240" height="44" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <rect x="280" y="180" width="4" height="44" rx="2" fill="#d97706"/>
    <text x="402" y="207" font-family="sans-serif" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">B3 · 조건 분기</text>
  </g>

  <!-- B4 -->
  <g id="B4">
    <rect x="280" y="268" width="240" height="44" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <rect x="280" y="268" width="4" height="44" rx="2" fill="#059669"/>
    <text x="402" y="295" font-family="sans-serif" font-size="16" font-weight="600" fill="#065f46" text-anchor="middle">B4 · 단계 4</text>
  </g>

  <!-- B5 -->
  <g id="B5">
    <rect x="280" y="346" width="240" height="44" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <rect x="280" y="346" width="4" height="44" rx="2" fill="#7c3aed"/>
    <text x="402" y="373" font-family="sans-serif" font-size="16" font-weight="600" fill="#5b21b6" text-anchor="middle">B5 · 반복 확인</text>
  </g>

  <!-- B6 -->
  <g id="B6">
    <rect x="280" y="424" width="240" height="44" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <rect x="280" y="424" width="4" height="44" rx="2" fill="#0284c7"/>
    <text x="402" y="451" font-family="sans-serif" font-size="16" font-weight="600" fill="#075985" text-anchor="middle">B6 · 마무리</text>
  </g>

  <!-- Exit -->
  <g id="Exit">
    <rect x="610" y="180" width="200" height="44" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <rect x="610" y="180" width="4" height="44" rx="2" fill="#dc2626"/>
    <text x="712" y="207" font-family="sans-serif" font-size="16" font-weight="600" fill="#991b1b" text-anchor="middle">Exit · 종료</text>
  </g>

  <!-- 화살표 6개 -->
  <!-- 1: B1 -> B2 -->
  <path d="M 400 68 L 400 98" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 2: B2 -> B3 -->
  <path d="M 400 146 L 400 176" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 3: B3 -> B4 -->
  <path d="M 400 224 L 400 264" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="410" y="248" font-family="sans-serif" font-size="13" fill="#334155">Yes</text>

  <!-- 4: B3 -> Exit -->
  <path d="M 520 202 L 606 202" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="563" y="194" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">No</text>

  <!-- 5: B4 -> B5 -->
  <path d="M 400 312 L 400 342" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 6: B5 -> B1 -->
  <path d="M 280 368 L 190 368 L 190 46 L 276 46" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="180" y="212" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="end">재시도</text>
</svg>
